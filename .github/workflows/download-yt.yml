name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
      format:
        description: 'yt-dlp format selector (default: up to 720p)'
        required: false
        default: 'bestvideo[height<=720]+bestaudio/best[height<=720]'

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only cookies.txt (not whole repo)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cookies.txt
          fetch-depth: 1

      - name: Install Deno (JavaScript runtime)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download video with remote challenge solver
        run: |
          mkdir -p videos
          yt-dlp \
            --format "${{ inputs.format }}" \
            --output "videos/%(id)s.%(ext)s" \
            --no-playlist \
            --cookies cookies.txt \
            --js-runtime deno \
            --remote-components ejs:github \
            "${{ inputs.url }}"

      - name: Commit and push video (allow sparse paths)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --sparse videos/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Add video: ${{ inputs.url }}"
            git push
          fi
