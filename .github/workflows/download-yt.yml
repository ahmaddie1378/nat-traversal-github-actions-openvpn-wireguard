name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
      download_type:
        description: 'Download type'
        required: true
        type: choice
        default: 'video'
        options:
          - 'video'
          - 'audio'
      format:
        description: 'Custom format selector (video only, ignored for audio)'
        required: false
        default: 'bestvideo[height<=720]+bestaudio/best[height<=720]'

permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only cookies.txt (not whole repo)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cookies.txt
          fetch-depth: 1

      - name: Install Deno (JavaScript runtime)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download content (video or audio)
        run: |
          mkdir -p videos
          if [ "${{ inputs.download_type }}" = "audio" ]; then
            echo "Downloading best audio (m4a)"
            yt-dlp \
              --format bestaudio/best \
              --extract-audio \
              --audio-format m4a \
              --output "videos/%(id)s.%(ext)s" \
              --no-playlist \
              --cookies cookies.txt \
              --js-runtime deno \
              --remote-components ejs:github \
              "${{ inputs.url }}"
          else
            echo "Downloading video with format: ${{ inputs.format }}"
            yt-dlp \
              --format "${{ inputs.format }}" \
              --output "videos/%(id)s.%(ext)s" \
              --no-playlist \
              --cookies cookies.txt \
              --js-runtime deno \
              --remote-components ejs:github \
              "${{ inputs.url }}"
          fi

      - name: Split files larger than 90 MB into gzipped chunks
        run: |
          max_bytes=$((90 * 1024 * 1024))
          for file in videos/*; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              if [ "$size" -gt "$max_bytes" ]; then
                echo "Splitting $file ($size bytes)"
                split -b 90M --numeric-suffixes=1 --suffix-length=2 "$file" "${file}.part"
                for chunk in "${file}.part"*; do
                  gzip "$chunk"
                done
                rm "$file"
              fi
            fi
          done

      - name: Disable Git LFS for videos folder
        run: echo "videos/* -filter -diff -merge" > .gitattributes

      - name: Commit and push content (no LFS)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --sparse videos/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Add ${{ inputs.download_type }}: ${{ inputs.url }}"
            git push
          fi

      - name: Clean up temporary .gitattributes
        run: rm -f .gitattributes
