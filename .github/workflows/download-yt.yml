name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
      download_type:
        description: 'Download type'
        required: true
        type: choice
        default: 'video'
        options:
          - 'video'
          - 'audio'
      format:
        description: 'Custom format selector (video only, ignored for audio)'
        required: false
        default: 'bestvideo[height<=720]+bestaudio/best[height<=720]'

permissions:
  contents: write

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download cookies.txt via API (no clone)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3.raw" \
               -o cookies.txt \
               "https://api.github.com/repos/${{ github.repository }}/contents/cookies.txt?ref=${{ github.ref_name }}"

      - name: Install Deno (JavaScript runtime)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download video or audio
        run: |
          mkdir -p videos
          if [ "${{ inputs.download_type }}" = "audio" ]; then
            echo "Downloading best audio (m4a)"
            yt-dlp \
              --format bestaudio/best \
              --extract-audio \
              --audio-format m4a \
              --output "videos/%(id)s.%(ext)s" \
              --no-playlist \
              --cookies cookies.txt \
              --js-runtime deno \
              --remote-components ejs:github \
              "${{ inputs.url }}"
          else
            echo "Downloading video with format: ${{ inputs.format }}"
            yt-dlp \
              --format "${{ inputs.format }}" \
              --output "videos/%(id)s.%(ext)s" \
              --no-playlist \
              --cookies cookies.txt \
              --js-runtime deno \
              --remote-components ejs:github \
              "${{ inputs.url }}"
          fi

      - name: Split files larger than 90 MB into gzipped chunks
        run: |
          max_bytes=$((90 * 1024 * 1024))
          for file in videos/*; do
            if [ -f "$file" ]; then
              size=$(stat -c%s "$file")
              if [ "$size" -gt "$max_bytes" ]; then
                echo "Splitting $file ($size bytes)"
                split -b 90M --numeric-suffixes=1 --suffix-length=2 "$file" "${file}.part"
                for chunk in "${file}.part"*; do
                  gzip "$chunk"
                done
                rm "$file"
              fi
            fi
          done

      - name: Upload all files to repository via API (no git clone)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file_path in videos/*; do
            [ -f "$file_path" ] || continue
            filename=$(basename "$file_path")
            # Read and base64-encode the file
            content_base64=$(base64 -w 0 "$file_path")
            # Upload (create or update) the file via GitHub API
            gh api --method PUT \
              "/repos/${{ github.repository }}/contents/videos/$filename" \
              -f message="Add ${{ inputs.download_type }}: ${{ inputs.url }}" \
              -f content="$content_base64" \
              -f branch="${{ github.ref_name }}"
            echo "Uploaded: $filename"
          done
