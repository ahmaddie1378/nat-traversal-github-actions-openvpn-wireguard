name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video/playlist URL'
        required: true
      download_type:
        description: 'Download type'
        required: true
        type: choice
        default: 'video'
        options:
          - 'video'
          - 'audio'
      playlist_mode:
        description: 'Download a whole playlist?'
        required: true
        type: choice
        default: 'single'
        options:
          - 'single'
          - 'playlist'
      format:
        description: 'Format string (video only, ignored for audio)'
        required: false
        default: 'bestvideo[height<=720]+bestaudio/best[height<=720]'

permissions:
  contents: write

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Fast shallow checkout (only cookies.txt)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            cookies.txt
          fetch-depth: 1

      - name: Install Deno (JavaScript runtime)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download content (single or playlist)
        run: |
          mkdir -p videos

          # Build flags depending on playlist mode
          if [ "${{ inputs.playlist_mode }}" = "playlist" ]; then
            playlist_flag="--yes-playlist"
          else
            playlist_flag="--no-playlist"
          fi

          if [ "${{ inputs.download_type }}" = "audio" ]; then
            echo "Downloading audio (single or playlist)"
            yt-dlp \
              --format bestaudio/best \
              --extract-audio \
              --audio-format m4a \
              --output "videos/%(playlist_index)s-%(id)s.%(ext)s" \
              $playlist_flag \
              --cookies cookies.txt \
              --js-runtime deno \
              --remote-components ejs:github \
              "${{ inputs.url }}"
          else
            echo "Downloading video (merged single file per video)"
            yt-dlp \
              --format "${{ inputs.format }}" \
              --merge-output-format mp4 \
              --output "videos/%(playlist_index)s-%(id)s.%(ext)s" \
              $playlist_flag \
              --cookies cookies.txt \
              --js-runtime deno \
              --remote-components ejs:github \
              "${{ inputs.url }}"
          fi

      - name: Split any file larger than 90 MB into gzipped chunks
        run: |
          max_bytes=$((90 * 1024 * 1024))
          for file in videos/*; do
            [ -f "$file" ] || continue
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$max_bytes" ]; then
              echo "Splitting $file ($size bytes)"
              split -b 90M --numeric-suffixes=1 --suffix-length=2 "$file" "${file}.part"
              for chunk in "${file}.part"*; do
                gzip "$chunk"
              done
              rm "$file"
            fi
          done

      - name: Disable Git LFS for videos folder
        run: echo "videos/* -filter -diff -merge" > .gitattributes

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --sparse videos/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Add ${{ inputs.download_type }} (${{ inputs.playlist_mode }}): ${{ inputs.url }}"
            git push
          fi

      - name: Clean up temporary .gitattributes
        run: rm -f .gitattributes
