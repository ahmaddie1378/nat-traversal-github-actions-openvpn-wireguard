name: Relay Forwarder Server

on:
  workflow_dispatch:

jobs:
  forwarder:
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create forwarder server
        run: |
          cat > server.js << 'EOF'
          const http = require('http');
          const PORT = process.env.PORT || 8888;
          const AUTH_TOKEN = process.env.AUTH_TOKEN || 'mysecrettoken';

          const server = http.createServer(async (req, res) => {
            if (req.method !== 'POST' || req.url !== '/fetch') {
              res.writeHead(404);
              return res.end();
            }
            let body = '';
            req.on('data', chunk => body += chunk);
            req.on('end', async () => {
              try {
                const params = JSON.parse(body);
                if (params.token !== AUTH_TOKEN) {
                  res.writeHead(403);
                  return res.end('Forbidden');
                }
                const fetchOptions = {
                  method: params.method || 'GET',
                  headers: params.headers || {},
                };
                if (params.body) {
                  fetchOptions.body = Buffer.from(params.body, 'base64');
                }
                const response = await fetch(params.url, fetchOptions);
                const responseBuffer = await response.arrayBuffer();
                const responseHeaders = {};
                response.headers.forEach((value, key) => {
                  responseHeaders[key] = value;
                });
                res.writeHead(200, { 'Content-Type': 'application/json' });
                res.end(JSON.stringify({
                  s: response.status,
                  h: responseHeaders,
                  b: Buffer.from(responseBuffer).toString('base64'),
                }));
              } catch (err) {
                res.writeHead(502);
                res.end(JSON.stringify({ error: String(err) }));
              }
            });
          });
          server.listen(PORT, () => console.log(`Forwarder listening on ${PORT}`));
          EOF

      - name: Start forwarder and create tunnel
        run: |
          node server.js &
          sleep 2
          # Use ssh to expose port 8888 via serveo.net
          ssh -o StrictHostKeyChecking=no -R 80:localhost:8888 serveo.net &
          sleep 5
          echo "Tunnel started. Public URL will appear in the ssh output (https://xxx.serveo.net)."
          sleep 21000
