name: Download Blocked File (LFS)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct URL of the file'
        required: true
      filename:
        description: 'Filename to save as (optional)'
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}    # ← add this line

      - name: Setup Git LFS
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Download the file
        run: |
          URL="${{ inputs.url }}"
          if [ -n "${{ inputs.filename }}" ]; then
            FILENAME="${{ inputs.filename }}"
          else
            FILENAME=$(basename "$URL" | cut -d '?' -f1)
          fi
          echo "Downloading $URL => $FILENAME"
          wget --timeout=30 -q -O "$FILENAME" "$URL" || curl -L --max-time 30 -o "$FILENAME" "$URL"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Track file with Git LFS
        run: |
          git lfs track "$FILENAME"
          git add .gitattributes

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILENAME"
          git commit -m "Download (LFS): $FILENAME" || echo "Nothing to commit"
          git push
