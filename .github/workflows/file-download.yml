name: Download Blocked File

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Direct URL of the file you want (must be publicly accessible)'
        required: true
      filename:
        description: 'Filename to save as (optional – leave empty to use name from URL)'
        required: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the file
        run: |
          URL="${{ inputs.url }}"
          if [ -n "${{ inputs.filename }}" ]; then
            FILENAME="${{ inputs.filename }}"
          else
            FILENAME=$(basename "$URL" | cut -d '?' -f1)
          fi
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV   # ← export for later steps
          echo "Downloading $URL => $FILENAME"
          wget --timeout=30 -q -O "$FILENAME" "$URL" || \
            curl -L --max-time 30 -o "$FILENAME" "$URL"

      - name: Compress and split if >90 MB
        run: |
          FILENAME="${{ env.FILENAME }}"   # or just $FILENAME (already exported)
          THRESHOLD=$((90 * 1024 * 1024))

          # Better size check (file must exist)
          if [ ! -f "$FILENAME" ]; then
            echo "ERROR: File $FILENAME not found!"
            exit 1
          fi

          FILESIZE=$(stat -c%s "$FILENAME")
          echo "File size: $FILESIZE bytes"

          if [ "$FILESIZE" -gt "$THRESHOLD" ]; then
            echo "Splitting..."
            gzip -c "$FILENAME" > "$FILENAME.gz"
            rm "$FILENAME"
            split -b 90M -d "$FILENAME.gz" "$FILENAME.gz.part"
            rm "$FILENAME.gz"
            echo "Parts created:"
            ls -lh "$FILENAME.gz.part"*
          else
            echo "No splitting needed."
          fi

      - name: Commit file(s) to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Download: $FILENAME" || echo "Nothing to commit"
          git push
