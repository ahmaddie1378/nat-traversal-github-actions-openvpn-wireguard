name: Download YouTube Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube video URL'
        required: true
      format:
        description: 'yt-dlp format selector (default: best video+audio up to 720p)'
        required: false
        default: 'bestvideo[height<=720]+bestaudio/best[height<=720]'

# Give the workflow permission to push commits
permissions:
  contents: write

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download video
        run: |
          mkdir -p videos
          yt-dlp \
            --format "${{ inputs.format }}" \
            --output "videos/%(id)s.%(ext)s" \
            --no-playlist \
            "${{ inputs.url }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          # Only commit if something was actually downloaded
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Add YouTube video: ${{ inputs.url }}"
            git push
          fi
